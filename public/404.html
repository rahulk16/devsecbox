<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404 — Page Not Found — DevSecBox</title>
		<meta name="robots" content="noindex, follow" />
		<link rel="stylesheet" href="/style.css" />
		<style>
			.notfound {
				max-width: 480px;
				margin: 0 auto;
				padding: 100px 20px;
				text-align: center;
			}
			.notfound .code {
				font-family: "JetBrains Mono", monospace;
				font-size: 13px;
				letter-spacing: 0.12em;
				color: var(--muted);
				margin-bottom: 14px;
			}
			.notfound h1 {
				font-size: 32px;
				letter-spacing: -0.02em;
				margin: 0 0 10px;
			}
			.notfound p {
				color: var(--muted);
				font-size: 14.5px;
				margin: 0 0 26px;
			}
			.notfound a.home-btn {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-family: "Space Grotesk", sans-serif;
				font-weight: 600;
				font-size: 14px;
				text-decoration: none;
				background: var(--accent);
				color: #fff;
				padding: 10px 18px;
				border-radius: 7px;
			}
		</style>
	</head>
	<body>
		<nav class="nav">
			<a href="/" class="brand">DevSecBox</a>
		</nav>

		<div class="notfound">
			<div class="code">ERROR 404</div>
			<h1>Page not found</h1>
			<p>The page you're looking for doesn't exist, or may have moved.</p>
			<a class="home-btn" href="/">
				Back to DevSecBox
				<svg
					width="14"
					height="14"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round">
					<line x1="5" y1="12" x2="19" y2="12"></line>
					<polyline points="12 5 19 12 12 19"></polyline>
				</svg>
			</a>
		</div>
	</body>
</html>
