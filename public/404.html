<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404 — Page Not Found — DevSecBox</title>
		<meta name="robots" content="noindex, follow" />
		<link rel="stylesheet" href="/style.css" />
		<style>
			.notfound {
				max-width: 480px;
				margin: 0 auto;
				padding: 90px 20px;
				text-align: center;
			}
			.notfound svg.illustration {
				display: block;
				margin: 0 auto 26px;
			}
			.notfound .cursor {
				animation: blink 1.1s step-end infinite;
			}
			@keyframes blink {
				0%,
				49% {
					opacity: 1;
				}
				50%,
				100% {
					opacity: 0;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.notfound .cursor {
					animation: none;
				}
			}
			.notfound .code {
				font-family: "JetBrains Mono", monospace;
				font-size: 13px;
				letter-spacing: 0.12em;
				color: var(--muted);
				margin-bottom: 14px;
			}
			.notfound h1 {
				font-size: 32px;
				letter-spacing: -0.02em;
				margin: 0 0 10px;
			}
			.notfound p {
				color: var(--muted);
				font-size: 14.5px;
				margin: 0 0 26px;
			}
			.notfound a.home-btn {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-family: "Space Grotesk", sans-serif;
				font-weight: 600;
				font-size: 14px;
				text-decoration: none;
				background: var(--accent);
				color: #fff;
				padding: 10px 18px;
				border-radius: 7px;
			}
		</style>
	</head>
	<body>
		<nav class="nav">
			<a href="/" class="brand">DevSecBox</a>
		</nav>

		<div class="notfound">
			<svg
				class="illustration"
				width="220"
				height="150"
				viewBox="0 0 220 150"
				xmlns="http://www.w3.org/2000/svg">
				<!-- terminal window -->
				<rect
					x="10"
					y="10"
					width="200"
					height="130"
					rx="10"
					fill="#FFFFFF"
					stroke="var(--line)"
					stroke-width="1.5" />
				<!-- title bar -->
				<rect
					x="10"
					y="10"
					width="200"
					height="26"
					rx="10"
					fill="#FBFBFA"
					stroke="var(--line)"
					stroke-width="1.5" />
				<rect x="10" y="26" width="200" height="10" fill="#FBFBFA" />
				<circle cx="26" cy="23" r="3.5" fill="var(--line)" />
				<circle cx="38" cy="23" r="3.5" fill="var(--line)" />
				<circle cx="50" cy="23" r="3.5" fill="var(--line)" />

				<!-- prompt line -->
				<text
					x="26"
					y="64"
					font-family="JetBrains Mono, monospace"
					font-size="11"
					fill="var(--muted)">
					$ cd /page
				</text>

				<!-- big glitchy 404 -->
				<text
					x="110"
					y="102"
					text-anchor="middle"
					font-family="JetBrains Mono, monospace"
					font-weight="600"
					font-size="34"
					fill="var(--line)"
					transform="translate(-2,-2)">
					404
				</text>
				<text
					x="110"
					y="102"
					text-anchor="middle"
					font-family="JetBrains Mono, monospace"
					font-weight="600"
					font-size="34"
					fill="var(--accent)"
					opacity="0.55"
					transform="translate(2,1)">
					404
				</text>
				<text
					x="110"
					y="102"
					text-anchor="middle"
					font-family="JetBrains Mono, monospace"
					font-weight="600"
					font-size="34"
					fill="var(--ink)">
					404
				</text>

				<!-- blinking cursor -->
				<rect
					class="cursor"
					x="152"
					y="87"
					width="8"
					height="16"
					fill="var(--accent)" />

				<!-- bottom status line -->
				<text
					x="26"
					y="122"
					font-family="JetBrains Mono, monospace"
					font-size="10"
					fill="var(--muted)">
					not found: this route
				</text>
			</svg>

			<div class="code">ERROR 404</div>
			<h1>Page not found</h1>
			<p>The page you're looking for doesn't exist, or may have moved.</p>
			<a class="home-btn" href="/">
				Back to DevSecBox
				<svg
					width="14"
					height="14"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round">
					<line x1="5" y1="12" x2="19" y2="12"></line>
					<polyline points="12 5 19 12 12 19"></polyline>
				</svg>
			</a>
		</div>
	</body>
</html>
